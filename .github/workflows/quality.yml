name: Quality
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-ci
          POSTGRES_DB: creator_test
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U test' --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: services/api
      JWT_SECRET: test-only-ci-secret-at-least-32-characters
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://test:test-only-ci@localhost:5432/creator_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m ruff check services tests infra scripts
      - run: python -m pytest -q --junitxml=artifacts/pytest-${{ matrix.database }}.xml
      - run: python engineering/scripts/validate_contracts.py
      - run: python -m unittest discover -s engineering/tests -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-evidence-${{ matrix.database }}
          path: artifacts/
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:boundary
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  python-advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip_audit --local --format json --output pip-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-advisories
          path: pip-audit.json
